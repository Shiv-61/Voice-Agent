    "requests>=2.31.0",
    "sarvamai==0.1.31a4",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "websockets>=12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pypdf>=4.0.0",
    "chromadb>=0.4.24",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "faster-whisper>=1.2.1",
    "scipy>=1.18.1",
    "pyyaml>=6.0.0",
    "pgvector>=0.3.0",
    "psycopg>=3.1.0",
    "sentence-transformers>=3.0.0",
