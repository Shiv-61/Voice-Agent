services:
  - type: web
    name: voice-agent-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b:free
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: STT_PROVIDER
        value: sarvam
      - key: TTS_SPEAKER
        value: priya
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
